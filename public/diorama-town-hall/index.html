<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>镇公所 · Town Hall</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f3efe6;
        cursor: grab;
      }
      body:active { cursor: grabbing; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf3efe6);

      const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.05, 80);
      camera.position.set(-7.2, 8.2, 8.6);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.16;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0.1, 2.05, 0.2);
      controls.minDistance = 6.2;
      controls.maxDistance = 18;
      controls.maxPolarAngle = Math.PI * 0.46;

      scene.add(new THREE.AmbientLight(0xfff1dc, 0.64));
      scene.add(new THREE.HemisphereLight(0xffe6c4, 0xc4a888, 0.5));
      const sun = new THREE.DirectionalLight(0xffe0b0, 1.42);
      sun.position.set(7.2, 11.5, 5.4);
      sun.castShadow = true;
      scene.add(sun);
      const fill = new THREE.DirectionalLight(0xc8d8f0, 0.32);
      fill.position.set(-6.5, 6.2, -3.8);
      scene.add(fill);

      new GLTFLoader().load("./town_hall.glb", (root) => {
        root.scene.traverse((obj) => {
          if (obj.isMesh) {
            obj.castShadow = true;
            obj.receiveShadow = true;
          }
        });
        scene.add(root.scene);
      });

      function tick() {
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }
      tick();
      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    </script>
  </body>
</html>
